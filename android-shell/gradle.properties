# Project-wide Gradle settings for the Tarven Android shell.

# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use parallel builds and caching where possible.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is required by the Android Gradle Plugin 8.x.
android.useAndroidX=true
android.enableJetifier=false

# Faster resource processing.
android.nonTransitiveRClass=true
