name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: android-shell
        run: gradle assembleDebug --no-daemon

      - name: Rename APK (sanitize ref name for filenames)
        run: |
          VERSION="${GITHUB_REF_NAME//\//-}"
          VERSION="${VERSION#v}"
          cp android-shell/app/build/outputs/apk/debug/app-debug.apk "Tarven-v${VERSION}.apk"
          echo "APK_PATH=Tarven-v${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tarven-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Tarven ${{ github.ref_name }}
          files: ${{ env.APK_PATH }}
